contract_version: "2.0"
schema_version: "source-contract-2.0"
required_fields:
  - owner
  - natural_keys
  - canonical_keys
  - grain
  - units
  - effective_dates
  - null_policy
  - unmatched_mapping_policy
  - lineage
  - row_budget
  - schema_version
  - consuming_apps

tables:
  site_master:
    owner: SOURCE_RAW
    natural_keys: [site_code]
    canonical_keys: [canonical_site_id]
    grain: one source site
    units: {}
    effective_dates: {start: null, end: null}
    null_policy: keys_required_attributes_source_nullable
    unmatched_mapping_policy: reject_unless_mapping_exception
    lineage: [raw_site.db.site_master, brnz_ref_site, slvr_ref_site]
    row_budget: 30
    schema_version: "1.0"
    consuming_apps: [data_operations, data_explorer, capacity_planning]
  test_type_master:
    owner: SOURCE_RAW
    natural_keys: [test_type]
    canonical_keys: [canonical_test_type_id]
    grain: one source test type
    units: {}
    effective_dates: {start: null, end: null}
    null_policy: keys_required_attributes_source_nullable
    unmatched_mapping_policy: reject_unless_mapping_exception
    lineage: [raw_test.db.test_type_master, brnz_ref_test_type, slvr_ref_test_type]
    row_budget: 24
    schema_version: "1.0"
    consuming_apps: [data_operations, data_explorer, capacity_planning]
  equipment_master:
    owner: SOURCE_RAW
    natural_keys: [equipment_id]
    canonical_keys: [canonical_machine_id]
    grain: one source equipment model
    units: {}
    effective_dates: {start: null, end: null}
    null_policy: equipment_id_required
    unmatched_mapping_policy: reject_unless_mapping_exception
    lineage: [raw_machine.db.equipment_master, brnz_ref_equipment, slvr_ref_equipment]
    row_budget: 85
    schema_version: "1.0"
    consuming_apps: [data_operations, data_explorer, capacity_planning]
  manufacturer_master:
    owner: SOURCE_RAW
    natural_keys: [manufacturer]
    canonical_keys: [canonical_manufacturer_id]
    grain: one source manufacturer
    units: {}
    effective_dates: {start: null, end: null}
    null_policy: key_required
    unmatched_mapping_policy: retain_source_code_until_contract_activated
    lineage: [raw_product.db.manufacturer_master]
    row_budget: 100
    schema_version: "1.0"
    consuming_apps: [data_operations, data_explorer]
  product_master:
    owner: SOURCE_RAW
    natural_keys: [product_number]
    canonical_keys: [canonical_product_id]
    grain: one source product
    units: {}
    effective_dates: {start: null, end: null}
    null_policy: product_number_required
    unmatched_mapping_policy: reject_unless_mapping_exception
    lineage: [raw_product.db.product_master, brnz_prod_master, slvr_prod_master]
    row_budget: 48
    schema_version: "1.0"
    consuming_apps: [data_operations, data_explorer, capacity_planning]
  product_bom:
    owner: SOURCE_RAW
    natural_keys: [bom_id]
    canonical_keys: [canonical_parent_product_id, canonical_child_product_id]
    grain: parent product by child product by effective interval
    units: {quantity_per_parent: EA}
    effective_dates: {start: effective_start_date, end: effective_end_date}
    null_policy: keys_and_quantity_required
    unmatched_mapping_policy: reject_unless_mapping_exception
    lineage: [raw_product.db.product_bom]
    row_budget: 200
    schema_version: "1.0"
    consuming_apps: [data_operations, capacity_planning]
  product_route:
    owner: SOURCE_RAW
    natural_keys: [route_id]
    canonical_keys: [canonical_product_id, canonical_route_id]
    grain: product route by effective interval
    units: {}
    effective_dates: {start: effective_start_date, end: effective_end_date}
    null_policy: keys_required
    unmatched_mapping_policy: reject_unless_mapping_exception
    lineage: [raw_product.db.product_route]
    row_budget: 48
    schema_version: "1.0"
    consuming_apps: [data_operations, capacity_planning]
  route_step:
    owner: SOURCE_RAW
    natural_keys: [route_step_id]
    canonical_keys: [canonical_route_id, canonical_test_type_id]
    grain: route by ordered step
    units: {}
    effective_dates: {start: null, end: null}
    null_policy: route_step_test_required
    unmatched_mapping_policy: reject_unless_mapping_exception
    lineage: [raw_product.db.route_step]
    row_budget: 384
    schema_version: "1.0"
    consuming_apps: [data_operations, capacity_planning]
  site_product_source:
    owner: SOURCE_RAW
    natural_keys: [source_id]
    canonical_keys: [canonical_site_id, canonical_product_id]
    grain: product by source site by effective interval
    units: {allocation_ratio: PCT}
    effective_dates: {start: effective_start_date, end: effective_end_date}
    null_policy: keys_and_allocation_required
    unmatched_mapping_policy: reject_unless_mapping_exception
    lineage: [raw_product.db.site_product_source]
    row_budget: 120
    schema_version: "1.0"
    consuming_apps: [data_operations, capacity_planning]
  demand_requirement:
    owner: SOURCE_RAW
    natural_keys: [demand_id]
    canonical_keys: [canonical_site_id, canonical_product_id]
    grain: site by product by month by planning version by demand class
    units: {quantity: EA, total_requirement: EA}
    effective_dates: {start: plan_as_of_date, end: null}
    null_policy: keys_and_quantities_required
    unmatched_mapping_policy: reject_unless_mapping_exception
    lineage: [raw_demand.db.demand_requirement, brnz_demand_requirement, slvr_demand_long, serving]
    row_budget: 1000000
    schema_version: "1.0"
    consuming_apps: [data_operations, data_explorer, capacity_planning, decision_intelligence]
  target_test_time:
    owner: SOURCE_RAW
    natural_keys: [site, product_number, test_type, planning_version_id]
    canonical_keys: [canonical_site_id, canonical_product_id, canonical_test_type_id]
    grain: site by product by test by planning version
    units: {monthly_values: SEC}
    effective_dates: {start: plan_as_of_date, end: null}
    null_policy: keys_required_month_values_source_nullable
    unmatched_mapping_policy: reject_unless_mapping_exception
    lineage: [raw_test.db.target_test_time, brnz_tgt_test_time, slvr_tgt_test_time_long, serving]
    row_budget: 100000
    schema_version: "1.0"
    consuming_apps: [data_operations, data_explorer, capacity_planning]
  target_yield:
    owner: SOURCE_RAW
    natural_keys: [site, product_number, test_type, planning_version_id]
    canonical_keys: [canonical_site_id, canonical_product_id, canonical_test_type_id]
    grain: site by product by test by planning version
    units: {monthly_values: PCT}
    effective_dates: {start: plan_as_of_date, end: null}
    null_policy: keys_required_month_values_source_nullable
    unmatched_mapping_policy: reject_unless_mapping_exception
    lineage: [raw_yield.db.target_yield, brnz_tgt_yield, slvr_tgt_yield_long, serving]
    row_budget: 100000
    schema_version: "1.0"
    consuming_apps: [data_operations, data_explorer, capacity_planning, decision_intelligence]
  site_equipment_inventory:
    owner: SOURCE_RAW
    natural_keys: [site, test_equipment_id]
    canonical_keys: [canonical_site_id, canonical_machine_id]
    grain: site by machine
    units: {monthly_values: EA, cycle_time_sec: SEC}
    effective_dates: {start: null, end: null}
    null_policy: keys_required
    unmatched_mapping_policy: reject_unless_mapping_exception
    lineage: [raw_machine.db.site_equipment_inventory, brnz_site_equip_inv, slvr_site_equip_inv_long, serving]
    row_budget: 300
    schema_version: "1.0"
    consuming_apps: [data_operations, data_explorer, capacity_planning]
  site_soft:
    owner: SOURCE_RAW
    natural_keys: [site]
    canonical_keys: [canonical_site_id]
    grain: site
    units: {hours: HR, allowance_pct: PCT, productivity_pct: PCT}
    effective_dates: {start: null, end: null}
    null_policy: site_required
    unmatched_mapping_policy: reject_unless_mapping_exception
    lineage: [raw_site.db.site_soft, brnz_site_soft, slvr_site_soft_long, serving]
    row_budget: 30
    schema_version: "1.0"
    consuming_apps: [data_operations, data_explorer, capacity_planning]
  machine_execution:
    owner: SOURCE_RAW
    natural_keys: [record_id]
    canonical_keys: [canonical_site_id, canonical_product_id, canonical_test_type_id]
    grain: source execution event
    units: {passed_qty: EA, failed_qty: EA, total_qty: EA, test_duration_avg_sec: SEC}
    effective_dates: {start: execution_date, end: execution_date}
    null_policy: event_keys_and_quantities_required_measurements_source_nullable
    unmatched_mapping_policy: reject_unless_mapping_exception
    lineage: [raw_execution.db.machine_execution, brnz_machine_execution, slvr_machine_execution, serving]
    row_budget: 3000000
    schema_version: "1.0"
    consuming_apps: [data_operations, data_explorer, capacity_planning, decision_intelligence]
  machine_test_param:
    owner: SOURCE_RAW
    natural_keys: [parameter_record_id]
    canonical_keys: [canonical_execution_id, canonical_test_type_id]
    grain: execution event by test parameter outcome
    units: {total_qty: EA, first_pass_yield: PCT}
    effective_dates: {start: execution_date, end: execution_date}
    null_policy: execution_reference_required
    unmatched_mapping_policy: reject_unless_mapping_exception
    lineage: [raw_test.db.machine_test_param, brnz_machine_test_param, slvr_machine_test_param, serving]
    row_budget: 3000000
    schema_version: "1.0"
    consuming_apps: [data_operations, data_explorer, capacity_planning]
  machine_logs:
    owner: SOURCE_RAW
    natural_keys: [log_event_id]
    canonical_keys: [canonical_execution_id, canonical_site_id]
    grain: source machine log event
    units: {}
    effective_dates: {start: log_ts, end: log_ts}
    null_policy: log_timestamp_and_execution_reference_required
    unmatched_mapping_policy: retain_with_explicit_exception
    lineage: [raw_machine.db.machine_logs, brnz_machine_logs, slvr_machine_logs]
    row_budget: 300000
    schema_version: "1.0"
    consuming_apps: [data_operations, data_explorer, decision_intelligence]
  equipment_cost_reference:
    owner: SOURCE_RAW
    natural_keys: [equipment_cost_reference_id]
    canonical_keys: [canonical_equipment_id]
    grain: equipment by effective interval
    units: {purchase_cost_usd: USD, annual_maintenance_cost_usd: USD, installation_cost_usd: USD, lead_time_days: DAY}
    effective_dates: {start: effective_start_date, end: effective_end_date}
    null_policy: equipment_interval_cost_currency_status_required
    unmatched_mapping_policy: reject_unless_mapping_exception
    lineage: [raw_machine.db.equipment_cost_reference, brnz_equipment_cost_reference, slvr_equipment_cost_reference, gold_equipment_cost_reference, srv_equipment_cost_reference]
    row_budget: 100
    schema_version: "1.0"
    consuming_apps: [decision_intelligence]
metrics:
  demand_quantity:
    owner: demand_requirement
    natural_keys: [site, product_number, month_key, planning_version_id, demand_class]
    canonical_keys: [canonical_site_id, canonical_product_id]
    grain: site by product by month by planning version by demand class
    units: {value: EA}
    effective_dates: {start: plan_as_of_date, end: null}
    formula: SUM(total_requirement)
    null_policy: reject
    unmatched_mapping_policy: reject_unless_mapping_exception
    lineage: [raw_demand.db.demand_requirement, serving]
    row_budget: 1000000
    schema_version: "1.0"
    consuming_apps: [capacity_planning, decision_intelligence]
  target_test_time_seconds:
    owner: target_test_time
    natural_keys: [site, product_number, test_type, month_key, planning_version_id]
    canonical_keys: [canonical_site_id, canonical_product_id, canonical_test_type_id]
    grain: site by product by test by month by planning version
    units: {value: SEC}
    effective_dates: {start: plan_as_of_date, end: null}
    formula: governed_month_value
    null_policy: exclude_null_with_coverage_flag
    unmatched_mapping_policy: reject_unless_mapping_exception
    lineage: [raw_test.db.target_test_time, serving]
    row_budget: 100000
    schema_version: "1.0"
    consuming_apps: [capacity_planning]
  target_yield_ratio:
    owner: target_yield
    natural_keys: [site, product_number, test_type, month_key, planning_version_id]
    canonical_keys: [canonical_site_id, canonical_product_id, canonical_test_type_id]
    grain: site by product by test by month by planning version
    units: {value: PCT}
    effective_dates: {start: plan_as_of_date, end: null}
    formula: governed_month_value
    null_policy: exclude_null_with_coverage_flag
    unmatched_mapping_policy: reject_unless_mapping_exception
    lineage: [raw_yield.db.target_yield, serving]
    row_budget: 100000
    schema_version: "1.0"
    consuming_apps: [capacity_planning, decision_intelligence]
  actual_output_quantity:
    owner: machine_execution
    natural_keys: [record_id]
    canonical_keys: [canonical_site_id, canonical_product_id, canonical_test_type_id]
    grain: site by product by test by execution date
    units: {value: EA}
    effective_dates: {start: execution_date, end: execution_date}
    formula: SUM(passed_qty)
    null_policy: reject
    unmatched_mapping_policy: reject_unless_mapping_exception
    lineage: [raw_execution.db.machine_execution, serving]
    row_budget: 3000000
    schema_version: "1.0"
    consuming_apps: [capacity_planning, decision_intelligence]

datasets:
  srv_equipment_cost_reference:
    owner: SERVING
    natural_keys: [equipment_cost_reference_id]
    canonical_keys: [canonical_equipment_id]
    grain: equipment by effective interval
    units: {purchase_cost_usd: USD, annual_maintenance_cost_usd: USD, installation_cost_usd: USD, lead_time_days: DAY}
    effective_dates: {start: effective_start_date, end: effective_end_date}
    null_policy: equipment_interval_cost_currency_status_required
    unmatched_mapping_policy: reject_unless_mapping_exception
    lineage: [gold_equipment_cost_reference, srv_equipment_cost_reference]
    row_budget: 100
    schema_version: "1.0"
    consuming_apps: [decision_intelligence]
