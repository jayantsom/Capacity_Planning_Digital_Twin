server:
  allowed_origins:
    - "http://127.0.0.1:8000"
    - "http://localhost:8000"

query:
  timeout_seconds: 10
  maximum_chart_points: 600
  maximum_table_rows: 200
  required_serving_tables:
    - srv_vw_capacity_summary
    - srv_actual_output
    - srv_demonstrated_capacity
    - srv_resource_constraints
    - srv_gcm_resource_contract

filters:
  capacity_modes:
    - NORMAL
    - MAXIMUM
  retest_models:
    NONE: "No Retest"
    TYPE1: "Standard / Type 1"
    TYPE2: "Measured / Type 2"
