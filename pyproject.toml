[project]
name = "capacity-planning-digital-twin"
version = "0.1.0"
description = "Digital twin for manufacturing capacity planning"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Data storage
    "duckdb>=0.10.0",
    # Data processing
    "pyspark==4.1.2",
    "pandas>=2.2.0",
    "polars>=0.20.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    # Synthetic data
    "faker>=24.0.0",
    # Configuration
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    # Utilities
    "loguru>=0.7.2",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    # ML (installed now, used later)
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "prophet>=1.1.5",
    "numba>=0.61.0",
    "llvmlite>=0.44.0",
    "shap>=0.44.0",
    # API (for MCP server later)
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.29.0",
    "python-dateutil>=2.9.0.post0",
    "scipy>=1.17.1",
    "imbalanced-learn>=0.14.2",
    "plotly>=6.8.0",
    "mcp>=1.28.1",
    "langgraph>=1.2.6",
    "langchain>=1.3.11",
    "langchain-ollama>=1.1.0",
    "langchain-core>=1.4.8",
    "httpx>=0.28.1",
]

[project.scripts]
capacity-generate = "data_operations.generator.generators.run_all_generators:main"
capacity-pipeline = "data_operations.pipeline.runner:main"
capacity-ml = "decision_intelligence.ml.run_ml:main"
capacity-twin = "capacity_home.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "capacity_home",
    "capacity_assistant",
    "data_explorer",
    "data_operations",
    "decision_intelligence",
    "src/capacity_twin_core",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Tool boundaries deliberately convert backend failures into safe user messages.
"capacity_assistant/agentic/mcp_server/tools/*.py" = ["BLE001"]

[tool.pytest.ini_options]
# Disable the optional LangSmith plugin because Windows policy blocks its native UUID helper.
addopts = "-p no:langsmith_plugin"
testpaths = [
    "capacity_home",
    "capacity_assistant",
    "data_explorer",
    "data_operations",
    "decision_intelligence",
    "src/capacity_twin_core",
]
