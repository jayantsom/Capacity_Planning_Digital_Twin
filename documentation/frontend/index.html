<body>
  <div data-shared-shell></div>
  <div class="documentation-page">
    <section data-shared-page-header data-mark="DC" data-eyebrow="KNOWLEDGE BASE"
      data-title="Documentation">
      <div data-page-actions>
        <span id="documentationStatus" class="ct-status" data-state="pending">CHECKING</span>
      </div>
    </section>
    <main id="main" class="documentation-workspace" tabindex="-1">
      <aside class="documentation-sidebar" aria-label="Documentation pages">
        <label>Find a page<input id="documentationSearch" type="search" placeholder="Search titles"></label>
        <nav id="documentationNavigation"></nav>
      </aside>
      <article class="documentation-content">
        <header>
          <p id="documentationPath"></p>
          <h2 id="documentationTitle">Loading documentation</h2>
        </header>
        <div id="markdownContent" class="markdown-content"></div>
      </article>
    </main>
  </div>
  <script type="module" src="/shared/static/shell.js?v=20261027a"></script>
