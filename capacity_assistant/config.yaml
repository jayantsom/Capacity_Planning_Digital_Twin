# Settings owned by Capacity Assistant and its local API.
server:
  allowed_origins:
    - "http://127.0.0.1:8000"
    - "http://localhost:8000"

agentic:
  llm_provider: ollama
  ollama_base_url: "http://localhost:11434"
  default_model: "llama3.1:8b"
  router_model: "llama3.1:8b"
  temperature: 0.1
  max_tokens: 2048
  streaming: true
  timeout_seconds: 120
  database_timeout_seconds: 15
  max_concurrent_requests: 1
  max_tool_rounds: 3
