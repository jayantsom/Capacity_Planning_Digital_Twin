<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Decision Intelligence</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/shared/static/shell.css?v=20261027a">
  <link rel="stylesheet" href="/shared/static/planning.css?v=20261027g">
  <link rel="stylesheet" href="/decision-intelligence/static/decision-intelligence.css?v=20261020f">
</head>
<body>
  <div data-shared-shell></div>

  <main id="workspace" class="workspace">
    <section data-shared-page-header data-mark="DI" data-eyebrow="MODEL DASHBOARDS"
      data-title="Decision Intelligence">
      <div class="title-actions" data-page-actions>
        <span id="healthStatus" class="service-status status-checking"><span aria-hidden="true">◌</span><span>CHECKING</span></span>
        <button id="runSelected" class="button secondary" type="button">Run this workflow</button>
        <button id="runAll" class="button primary" type="button">Run all workflows</button>
      </div>
    </section>

    <div class="tab-strip" role="tablist" aria-label="ML workflows">
      <button role="tab" aria-selected="true" data-workflow="demand" data-priority="1"><strong>Demand Forecasting</strong><small>18-MONTH FORECAST</small></button>
      <button role="tab" aria-selected="false" data-workflow="yield" data-priority="2" tabindex="-1"><strong>Yield Prediction</strong><small>MEASURED YIELD · SHAP</small></button>
      <button role="tab" aria-selected="false" data-workflow="oee-risk" data-priority="3" tabindex="-1"><strong>OEE Degradation</strong><small>RISK · NOT FAILURE</small></button>
      <button role="tab" aria-selected="false" data-workflow="oee-anomaly" data-priority="4" tabindex="-1"><strong>OEE Anomaly</strong><small>DRIVER · SEVERITY</small></button>
      <button role="tab" aria-selected="false" data-workflow="capex" data-priority="5" tabindex="-1"><strong>CapEx Simulation</strong><small>P50 · P80 · P95</small></button>
    </div>

    <section id="jobBand" class="job-band" aria-live="polite" hidden>
      <div><strong id="jobPhase">Starting</strong><span id="jobDetail"></span></div>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="jobProgress"></span></div>
      <output id="jobPercent">0%</output>
    </section>

    <form id="filters" class="filter-band">
      <label data-filter="grain">Operational grain<select id="grainFilter"><option value="MONTH">Month</option><option value="WEEK">ISO week</option></select></label>
      <label data-filter="site">Site<select id="siteFilter"><option value="">All sites</option></select></label>
      <label data-filter="product">Product<select id="productFilter"><option value="">All products</option></select></label>
      <label data-filter="test_type">Test type<select id="testFilter"><option value="">All tests</option></select></label>
      <label data-filter="machine">Machine<select id="machineFilter"><option value="">All machines</option></select></label>
      <label data-filter="planning_version">Planning version<select id="planningVersionFilter"><option value="">All planning versions</option></select></label>
      <label data-filter="month_from">Month from<input id="monthFrom" type="number" min="200001" max="220012" placeholder="YYYYMM"></label>
      <label data-filter="month_to">Month to<input id="monthTo" type="number" min="200001" max="220012" placeholder="YYYYMM"></label>
      <button class="button secondary" id="clearFilters" type="button">Clear</button>
      <button class="button primary" type="submit">Apply</button>
    </form>

    <section class="kpi-strip" id="kpiStrip" aria-label="Workflow metrics"></section>

    <section id="workflowCharts" class="workflow-chart-grid" aria-label="Workflow analytics"></section>

    <section class="table-panel model-panel">
      <div class="panel-title"><h2>Published model</h2><span>GOVERNED ML RELEASE</span></div>
      <dl id="modelMetadata" class="model-metadata"></dl>
    </section>

    <section id="operationalPanel" class="table-panel" hidden>
      <div class="panel-title">
        <h2 id="operationalTitle">Operational Performance</h2>
        <span id="operationalScope">DAILY FACTS · MONTH</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Period</th><th>Yield</th><th>OEE</th><th>Downtime</th><th>Throughput</th><th>Events</th><th>Coverage</th></tr></thead>
          <tbody id="operationalRows"></tbody>
        </table>
      </div>
    </section>

    <section class="table-panel">
      <div class="panel-title"><h2>Records</h2><button id="exportCsv" type="button">Export CSV</button></div>
      <div class="table-wrap">
        <table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
      </div>
    </section>
    <p id="pageStatus" class="page-status" aria-live="polite"></p>
  </main>
  <script type="module" src="/shared/static/shell.js?v=20261027a"></script>
  <script type="module" src="/decision-intelligence/static/decision-intelligence.js?v=20261027d"></script>
</body>
</html>
