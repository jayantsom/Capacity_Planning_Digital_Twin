# Settings owned by the five existing ML workflows.
random_seed: 42
model_artifact_subdir: models

evaluation:
  backtest_months: 6
  minimum_history_months: 12

publication:
  database: ml.duckdb
  require_artifact_checksum: true

server:
  allowed_origins:
    - "http://127.0.0.1:8000"
    - "http://localhost:8000"

jobs:
  history_limit: 20
  allow_selected_workflow: true

dashboard:
  default_table_limit: 100
  maximum_table_limit: 500
