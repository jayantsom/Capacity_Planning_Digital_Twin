query:
  maximum_chart_points: 600
  maximum_table_rows: 200
  required_serving_tables:
    - srv_scenario_inputs
    - srv_vw_capacity_summary
    - srv_resource_constraints

scenario:
  schema_version: "1.0.0"
  assumption_bounds:
    demand: [0.70, 1.30]
    yield: [0.70, 1.00]
    oee: [0.50, 1.00]
    shifts: [1.00, 4.00]
    equipment: [0.00, 100.00]
    retest: [0.00, 0.50]
    allocation: [0.00, 2.00]
    overtime: [0.00, 0.25]
